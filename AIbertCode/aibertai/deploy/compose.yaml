name: aibertai

services:
  postgres:
    image: pgvector/pgvector:pg16
    command: [postgres, -c, max_locks_per_transaction=256]
    environment:
      POSTGRES_DB: aibertai
      POSTGRES_USER: aibertai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run bash deploy/stack.sh init first}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  object-storage:
    image: rustfs/rustfs@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?Run bash deploy/stack.sh init first}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Run bash deploy/stack.sh init first}
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - object-storage:/data
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.19.1
    command:
      - -path
      - /migrations
      - -database
      - &database-url 'postgres://aibertai:${POSTGRES_PASSWORD:?Run bash deploy/stack.sh init first}@postgres:5432/aibertai?sslmode=disable'
      - up
    volumes:
      - ../backend/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      args:
        ENGINE_BUILD_VERSION: ${ENGINE_BUILD_VERSION:-}
    environment:
      AIBERTAI_DATABASE_URL: *database-url
      AIBERTAI_HTTP_ADDR: 0.0.0.0:8080
      AIBERTAI_PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in deploy/.env}
      AIBERTAI_S3_ENDPOINT: http://object-storage:9000
      AIBERTAI_S3_BUCKET: ${AIBERTAI_S3_BUCKET:-aibertai-resources}
      AIBERTAI_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Run bash deploy/stack.sh init first}
      AIBERTAI_S3_SECRET_KEY: ${S3_SECRET_KEY:?Run bash deploy/stack.sh init first}
      AIBERTAI_S3_FORCE_PATH_STYLE: "true"
      AIBERTAI_INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:?Set INITIAL_ADMIN_EMAIL in deploy/.env}
      AIBERTAI_INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD in deploy/.env}
      AIBERTAI_RUNTIME_STATE_DIR: /var/lib/aibertai
      AIBERTAI_DESIGN_PUBLIC_CACHE_DIR: ${DESIGN_PUBLIC_CACHE_DIR:-}
      AIBERTAI_ENGINE_RELEASE_DIR: ${ENGINE_RELEASE_DIR:-/opt/aibertai/host-releases}
      AIBERTAI_ENGINE_VERSION: ${ENGINE_VERSION:-}
      AIBERTAI_ENVIRONMENT_RUNTIME_DIR: ${ENVIRONMENT_RUNTIME_DIR:-}
      AIBERTAI_ENVIRONMENT_RUNTIME_VERSION: ${ENVIRONMENT_RUNTIME_VERSION:-}
    volumes:
      - runtime:/var/lib/aibertai
      - ./data/design-cache:/data/design-cache:ro
      - ./data/releases:/data/releases:ro
    depends_on:
      postgres:
        condition: service_healthy
      object-storage:
        condition: service_started
    restart: unless-stopped

  admin:
    build:
      context: ..
      dockerfile: deploy/admin.Dockerfile
    environment:
      AIBERTAI_DEV_BACKEND_URL: http://backend:8080
      ADMIN_LISTEN_HOST: 0.0.0.0
    ports:
      - "${LISTEN_HOST:-0.0.0.0}:${LISTEN_PORT:-5173}:5173"
    depends_on:
      - backend
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'Promise.all(["/", "/readyz", "/.well-known/oauth-authorization-server"].map(async (path) => { const response = await fetch("http://127.0.0.1:5173"+path); if (!response.ok) throw Error(path); await response.arrayBuffer(); })).catch(() => process.exit(1))'
      interval: 3s
      timeout: 4s
      retries: 40
    restart: unless-stopped

volumes:
  postgres:
  object-storage:
  runtime:
